<div class="flex items-center gap-2">
    <div class="px-4 py-1.5 rounded-2xl bg-slate-100/80 dark:bg-slate-800/80 text-sm font-medium text-slate-600 dark:text-slate-300 border border-slate-200/50 dark:border-slate-700/50">
        Data Atual: {{ data_atual|date:"d/m/Y" }}
    </div>
    {% if perfil_monitor %}
    <form action="{% url 'simular_proximo_dia' %}" method="POST" class="inline">
        {% csrf_token %}
        <button type="submit" class="px-3 py-1.5 rounded-xl bg-emerald-500 hover:bg-emerald-600 text-white text-xs font-bold transition-all shadow-sm flex items-center gap-1">
            ⏩ +1 Dia
        </button>
    </form>
    {% endif %}
</div>
