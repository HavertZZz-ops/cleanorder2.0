    <!--Logo funcional-->
        <div class="flex flex-col items-center mb-6">        
            <div class="bg-gradient-to-br from-[#0b4a42] to-[#127a68] text-white rounded-3xl shadow-md shadow-emerald-900/20 mb-3 p-2 flex items-center justify-center">
                <img src="../static/img/logo_casa.svg" alt="Logo" class="w-12 h-12 object-contain">
            </div>
            <h1 class="text-2xl font-black text-emerald-950 tracking-tight">CleanOrder</h1>
            <p class="text-slate-400 text-xs font-medium mt-1 text-center">Gestão Inteligente de Alojamentos</p>
        </div>

            <!--Mensagens de Erro-->
            {% if messages %}
                <div class="mb-6 p-4 bg-rose-50 border border-rose-100 rounded-2xl">
                    {% for message in messages %}
                        <p class="text-rose-600 text-sm text-center font-bold flex items-center justify-center gap-2">
                            <i class="fa-solid fa-circle-exclamation"></i>
                            {{ message }}
                        </p>
                    {% endfor %}
                </div>
            {% endif %}

            <form method="POST" action="{% url 'login' %}" class="space-y-5">
                {% csrf_token %}
                
                <!-- CPF -->
                <div class="space-y-1.5">
                    <label class="block text-slate-500 text-xs font-bold uppercase tracking-wider pl-1">CPF</label>
                    <input type="text" name="cpf" class="w-full px-4 py-3.5 bg-slate-100/70 border border-slate-200 rounded-2xl text-sm font-semibold text-slate-800 placeholder-slate-400 focus:bg-white focus:outline-none focus:ring-2 focus:ring-emerald-500/30/50 focus:border-emerald-600 transition-all" maxlength="11" placeholder="000.000.000-00" required>
                </div>
                
                <!-- Senha -->
                <div class="space-y-1.5">
                    <label class="block text-slate-500 text-xs font-bold uppercase tracking-wider pl-1">Senha</label>
                    <div class="relative">
                        <input type="password" name="password" id="id_password" class="w-full px-4 py-3.5 bg-slate-100/70 border border-slate-200 rounded-2xl text-sm font-semibold text-slate-800 placeholder-slate-400 focus:bg-white focus:outline-none focus:ring-2 focus:ring-emerald-500/30/50 focus:border-emerald-600 transition-all pr-12" placeholder="••••••••" required>
                        
                        <button type="button" id="togglePassword" class="absolute inset-y-0 right-1 flex items-center justify-center w-10 text-slate-400 hover:text-emerald-700 focus:outline-none transition-colors">
                            <img id="eyeIcon" src="{% static 'img/view-eye-svgrepo-com.svg' %}" alt="Mostrar senha" class="w-5 h-5 opacity-60 hover:opacity-100 transition-opacity"> 
                        </button>
                    </div>
                </div>
                
                <button type="submit" class="w-full bg-gradient-to-r from-[#0b4a42] to-[#127a68] text-white font-bold py-4 px-4 rounded-2xl hover:shadow-lg hover:shadow-emerald-900/30 transform hover:-translate-y-0.5 transition-all duration-200 flex justify-center items-center gap-2 mt-4">
                    <span>Acessar o Sistema</span>
                    <i class="fa-solid fa-arrow-right text-sm"></i>
                </button>
            </form>
        </div>

        <footer class="text-center text-slate-400 text-xs font-medium mt-8 tracking-wide">
            © 2026 CleanOrder.
        </footer>
        
    </main>

    
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const togglePassword = document.querySelector('#togglePassword');
            const passwordInput = document.querySelector('#id_password');
    
            if (togglePassword && passwordInput) {
                togglePassword.addEventListener('click', function (e) {
                    e.preventDefault(); 
                    
                    if (passwordInput.type === 'password') {
                        passwordInput.type = 'text';
                    } else {
                        passwordInput.type = 'password';
                    }
                });
            }
        });
    </script>
</body>
